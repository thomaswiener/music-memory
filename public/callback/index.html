<html lang="en">

    <title>MUSIC MEMORY</title>
    <!-- Spotify redirects here after login. Hand the ?code=… back to the app root,
         which finishes the PKCE exchange. Works on any static host, SPA fallback or not. -->

      location.replace(location.pathname.replace(/callback\/?(index\.html)?$/, '') + location.search)
    </script>
